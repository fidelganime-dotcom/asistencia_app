name: Flutter Web CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 0'

name: Flutter Web CI/CD

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build Web
        run: flutter build web --release --base-href "/asistencia_app/"

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          path: build/web
          target-branch: gh-pages
          name: asistencia_app

  notify:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        run: echo "Build completed: ${{ job.status }}"